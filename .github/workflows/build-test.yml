name: Build & Test

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore reqifsharp-sage.slnx

      - name: Build
        run: dotnet build reqifsharp-sage.slnx --no-restore --configuration Release /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test reqifsharp-sage.slnx --no-restore --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults

  spec-extract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/spec-extract
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: pytest
        run: pytest -v
